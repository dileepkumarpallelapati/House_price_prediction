<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House Price Prediction</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 16px; font-family: Arial, sans-serif; background: #eeebda; color: #eeebda; }
    .container { max-width: 950px; margin: auto; }
    header { text-align: center; margin-bottom: 24px; }
    header h1 { color: #282b4a; margin-bottom: 8px; }
    header p { color: #64748b; }
    .card { background: #282b4a; padding: 28px; border-radius: 18px; box-shadow: 0 8px 25px rgba(20,40,80,.08); }
    h2 { color: #5e84cf; margin-top: 0; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 7px; }
    small { display: block; color: #94a3b8; font-weight: 400; margin-top: 4px; }
    input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 9px; font-size: 15px; background: #fff; color: #111; }
    input:focus, select:focus { outline: 2px solid #93c5fd; border-color: #2563eb; }
    button { width: 100%; padding: 15px; margin-top: 24px; border: 0; border-radius: 10px; background: #384a71; color: white; font-size: 17px; font-weight: bold; cursor: pointer; }
    button:hover { background: #af6f6f; }
    .result { margin-top: 20px; padding: 18px; border-radius: 10px; text-align: center; font-size: 22px; font-weight: bold; }
    .ok { background: #ecfdf5; color: #065f46; }
    .bad { background: #fef2f2; color: #b91c1c; }
    @media (max-width: 650px) { .grid { grid-template-columns: 1fr; } .card { padding: 20px; } }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>House Price Prediction</h1>
    <p>Enter property details to estimate its selling price.</p>
  </header>

  <main class="card">
    <h2>House Details</h2>
    <form action="/predict" method="POST">
      <div class="grid">
        <div><label for="bedrooms">Bedrooms</label><input id="bedrooms" name="bedrooms" type="number" step="1" value="3" required></div>
        <div><label for="bathrooms">Bathrooms</label><input id="bathrooms" name="bathrooms" type="number" step="1" value="2" required></div>
        <div><label for="sqft_living">Living Area (sqft)</label><input id="sqft_living" name="sqft_living" type="number" min="0" step="any" value="1500" required></div>
        <div><label for="sqft_lot">Lot Area (sqft)</label><input id="sqft_lot" name="sqft_lot" type="number" min="0" step="any" value="5000" required></div>
        <div><label for="floors">Floors</label><input id="floors" name="floors" type="number" min="1" step="1" value="1" required></div>
        <div><label for="waterfront">Waterfront</label><select id="waterfront" name="waterfront"><option value="0">No</option><option value="1">Yes</option></select></div>
        <div><label for="view">View (0–4)</label><select id="view" name="view"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
        <div><label for="condition">Condition (1–5)</label><select id="condition" name="condition"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>
        <div><label for="sqft_above">Above Ground Area (sqft)</label><input id="sqft_above" name="sqft_above" type="number" min="0" step="any" value="1200" required></div>
        <div><label for="sqft_basement">Basement Area (sqft)</label><input id="sqft_basement" name="sqft_basement" type="number" min="0" step="any" value="300" required></div>
        <div><label for="yr_built">Year Built</label><input id="yr_built" name="yr_built" type="number" min="1800" max="2100" step="1" value="2010" required></div>
        <div><label for="yr_renovated">Year Renovated (0 if never)</label><input id="yr_renovated" name="yr_renovated" type="number" min="0" max="2100" step="1" value="0" required></div>
        <div><label for="city">City</label><select id="city" name="city" required><option value="0">Algona</option><option value="1">Auburn</option><option value="2">Beaux Arts Village</option><option value="3">Bellevue</option><option value="4">Black Diamond</option><option value="5">Bothell</option><option value="6">Burien</option><option value="7">Carnation</option><option value="8">Clyde Hill</option><option value="9">Covington</option><option value="10">Des Moines</option><option value="11">Duvall</option><option value="12">Enumclaw</option><option value="13">Fall City</option><option value="14">Federal Way</option><option value="15">Inglewood-Finn Hill</option><option value="16">Issaquah</option><option value="17">Kenmore</option><option value="18">Kent</option><option value="19">Kirkland</option><option value="20">Lake Forest Park</option><option value="21">Maple Valley</option><option value="22">Medina</option><option value="23">Mercer Island</option><option value="24">Milton</option><option value="25">Newcastle</option><option value="26">Normandy Park</option><option value="27">North Bend</option><option value="28">Pacific</option><option value="29">Preston</option><option value="30">Ravensdale</option><option value="31">Redmond</option><option value="32">Renton</option><option value="33">Sammamish</option><option value="34">SeaTac</option><option value="35">Seattle</option><option value="36">Shoreline</option><option value="37">Skykomish</option><option value="38">Snoqualmie</option><option value="39">Snoqualmie Pass</option><option value="40">Tukwila</option><option value="41">Vashon</option><option value="42">Woodinville</option><option value="43">Yarrow Point</option></select></div>
        <div><label for="statezip">State ZIP</label><select id="statezip" name="statezip" required><option value="0">WA 98001</option><option value="1">WA 98002</option><option value="2">WA 98003</option><option value="3">WA 98004</option><option value="4">WA 98005</option><option value="5">WA 98006</option><option value="6">WA 98007</option><option value="7">WA 98008</option><option value="8">WA 98010</option><option value="9">WA 98011</option><option value="10">WA 98014</option><option value="11">WA 98019</option><option value="12">WA 98022</option><option value="13">WA 98023</option><option value="14">WA 98024</option><option value="15">WA 98027</option><option value="16">WA 98028</option><option value="17">WA 98029</option><option value="18">WA 98030</option><option value="19">WA 98031</option><option value="20">WA 98032</option><option value="21">WA 98033</option><option value="22">WA 98034</option><option value="23">WA 98038</option><option value="24">WA 98039</option><option value="25">WA 98040</option><option value="26">WA 98042</option><option value="27">WA 98045</option><option value="28">WA 98047</option><option value="29">WA 98050</option><option value="30">WA 98051</option><option value="31">WA 98052</option><option value="32">WA 98053</option><option value="33">WA 98055</option><option value="34">WA 98056</option><option value="35">WA 98057</option><option value="36">WA 98058</option><option value="37">WA 98059</option><option value="38">WA 98065</option><option value="39">WA 98068</option><option value="40">WA 98070</option><option value="41">WA 98072</option><option value="42">WA 98074</option><option value="43">WA 98075</option><option value="44">WA 98077</option><option value="45">WA 98092</option><option value="46">WA 98102</option><option value="47">WA 98103</option><option value="48">WA 98105</option><option value="49">WA 98106</option><option value="50">WA 98107</option><option value="51">WA 98108</option><option value="52">WA 98109</option><option value="53">WA 98112</option><option value="54">WA 98115</option><option value="55">WA 98116</option><option value="56">WA 98117</option><option value="57">WA 98118</option><option value="58">WA 98119</option><option value="59">WA 98122</option><option value="60">WA 98125</option><option value="61">WA 98126</option><option value="62">WA 98133</option><option value="63">WA 98136</option><option value="64">WA 98144</option><option value="65">WA 98146</option><option value="66">WA 98148</option><option value="67">WA 98155</option><option value="68">WA 98166</option><option value="69">WA 98168</option><option value="70">WA 98177</option><option value="71">WA 98178</option><option value="72">WA 98188</option><option value="73">WA 98198</option><option value="74">WA 98199</option><option value="75">WA 98288</option><option value="76">WA 98354</option></select></div>
        <div><label for="country">Country</label><select id="country" name="country" required><option value="0">USA</option></select></div>
      </div>
      <button type="submit">Predict House Price</button>
    </form>

    {% if prediction %}
      <div class="result {{ 'bad' if prediction == 'Invalid inputs' else 'ok' }}">{{ prediction }}</div>
    {% endif %}
  </main>
</div>
</body>
</html>
